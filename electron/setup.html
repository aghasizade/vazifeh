<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
  <title>سامانه وظیفه</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f1ea; color: #14202e; font-family: Vazirmatn, Tahoma, "Segoe UI", sans-serif;
      background-image: linear-gradient(rgba(20,32,46,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(20,32,46,.045) 1px, transparent 1px); background-size: 22px 22px; }
    .card { width: min(420px, 92vw); background: #fff; border: 1px solid #e2dccf; border-radius: 18px; padding: 28px; box-shadow: 0 20px 40px -30px rgba(20,32,46,.5); }
    h1 { font-size: 19px; margin: 0 0 4px; }
    p { font-size: 13px; color: #5b6b7e; line-height: 1.9; margin: 0 0 18px; }
    label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px; }
    input { width: 100%; box-sizing: border-box; border: 1px solid #d8d1c2; border-radius: 10px; padding: 10px 12px; font: 15px Consolas, monospace; direction: ltr; }
    input:focus { outline: none; border-color: #e0913f; box-shadow: 0 0 0 3px rgba(224,145,63,.18); }
    button { margin-top: 14px; width: 100%; height: 44px; border: 0; border-radius: 12px; background: #14202e; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button.ghost { background: transparent; color: #2c3f55; border: 1px solid #e2dccf; }
    .error { margin-top: 12px; font-size: 13px; color: #b91c1c; min-height: 20px; }
    .logo { display: flex; gap: 12px; align-items: center; margin-bottom: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg width="46" height="46" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#14202e"/><rect x="14" y="15" width="36" height="9" rx="3" fill="#e0913f"/><rect x="14" y="28" width="36" height="9" rx="3" fill="#f4f1ea" opacity=".9"/><rect x="14" y="41" width="24" height="9" rx="3" fill="#f4f1ea" opacity=".55"/><path d="M41 45.5l3.2 3.2L51 42" fill="none" stroke="#34d399" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><h1>سامانه وظیفه</h1><div style="font-size:12px;color:#8593a3" id="mode">اتصال به سرور</div></div>
    </div>
    <p id="intro">آدرس سرور سامانه را وارد کنید (نشانی اینترنتی یا IP شبکه و درگاه). این کار فقط یک‌بار لازم است.</p>
    <label for="server">آدرس سرور</label>
    <input id="server" dir="ltr" placeholder="192.168.1.10:8090" autofocus />
    <button id="connect">اتصال</button>
    <button id="retry" class="ghost" hidden>تلاش دوباره</button>
    <div class="error" id="error"></div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const input = document.getElementById('server');
    const error = document.getElementById('error');
    input.value = params.get('server') || '';
    if (params.get('offline')) {
      document.getElementById('mode').textContent = 'سرور در دسترس نیست';
      document.getElementById('intro').textContent = 'اتصال به سرور برقرار نشد. اینترنت یا شبکه را بررسی کنید؛ برنامه هر ۳۰ ثانیه دوباره تلاش می‌کند.';
      document.getElementById('retry').hidden = false;
      setInterval(() => window.setup.retry(), 30000);
    }
    const connect = async () => {
      error.textContent = 'در حال بررسی…';
      const result = await window.setup.connect(input.value);
      error.textContent = result.ok ? '' : result.error;
    };
    document.getElementById('connect').onclick = connect;
    document.getElementById('retry').onclick = () => { error.textContent = 'در حال تلاش…'; window.setup.retry(); };
    input.addEventListener('keydown', (e) => e.key === 'Enter' && connect());
  </script>
</body>
</html>
