# Codex reviews each pull request and posts its findings as a comment.
# Needs the OPENAI_API_KEY repository secret; without it the job is skipped.
name: Codex review
on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      HAS_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v5
        if: env.HAS_KEY == 'true'
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false
          fetch-depth: 0

      - id: codex
        if: env.HAS_KEY == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt: |
            Review only the changes in ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}.
            Report real bugs, security issues and broken Persian/RTL text, briefly, with file and line.
            If nothing is wrong, say so in one line.

      - if: steps.codex.outputs.final-message != ''
        uses: actions/github-script@v7
        env:
          BODY: ${{ steps.codex.outputs.final-message }}
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              body: process.env.BODY
            });
